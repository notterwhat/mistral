[project]
name = "worker"
version = "0.1.0"
description = "Mistral Workflows worker: Hacker News tech briefing with podcast audio"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
